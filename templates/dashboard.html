<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Attendance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Smart Attendance System</span>
      <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row mb-3 text-center">
      <div class="col-6"><div class="card"><div class="card-body">
        <h6 class="text-muted">Registered users</h6><h3>{{ users|length }}</h3></div></div></div>
      <div class="col-6"><div class="card"><div class="card-body">
        <h6 class="text-muted">Records shown</h6><h3>{{ records|length }}</h3></div></div></div>
    </div>

    <form method="get" class="row g-2 mb-3">
      <div class="col-md-4"><input type="date" name="date" value="{{ date }}" class="form-control"></div>
      <div class="col-md-4">
        <select name="roll_no" class="form-select">
          <option value="">All users</option>
          {% for u in users %}
            <option value="{{ u[2] }}" {% if u[2] == roll_no %}selected{% endif %}>{{ u[1] }} ({{ u[2] }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button class="btn btn-primary">Filter</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Reset</a>
        <a href="{{ url_for('export_csv', date=date, roll_no=roll_no) }}" class="btn btn-success">Export CSV</a>
      </div>
    </form>

    <table class="table table-striped table-bordered bg-white">
      <thead class="table-dark">
        <tr><th>#</th><th>Name</th><th>Roll No</th><th>Date</th><th>Time</th></tr>
      </thead>
      <tbody>
        {% for r in records %}
          <tr><td>{{ loop.index }}</td><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td></tr>
        {% else %}
          <tr><td colspan="5" class="text-center text-muted">No records found</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>

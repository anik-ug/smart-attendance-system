<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 400px; margin-top: 12vh;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3 text-center">Smart Attendance - Admin</h4>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3"><input name="username" class="form-control" placeholder="Username" required></div>
          <div class="mb-3"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
